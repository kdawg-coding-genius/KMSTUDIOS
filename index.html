														<style>
															html, body {
															width: 100%;
															height: 100%;
															padding: 0;
															margin: 0;
															border: 0;
															overflow: hidden;
															}
															#unity-container {
															position: absolute;
															width: 100%;
															height: 100%;
															left: 0;
															top: 0;
															background: #000000 url("preload.gif") no-repeat center center;
															background-size: contain;
															}
															#unity-canvas {
															width: 100%;
															height: 100%;
															background-color: transparent;
															display: block;
															}
														</style>
													</head>
	<body>
		<div id="unity-container">
			<canvas id="unity-canvas" width="960" height="600" tabindex="-1" style="width: 100%; height: 100%; background: transparent;"></canvas>
		</div>
		<script src="Build/1.5.64.loader.js"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
			// Mobile device style: fill the whole browser client area with the game canvas:
			var meta = document.createElement('meta');
			meta.name = 'viewport';
			meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
			document.getElementsByTagName('head')[0].appendChild(meta);

			canvas.style.width = "100%";
			canvas.style.height = "100%";
			canvas.style.position = "fixed";

			document.body.style.textAlign = "left";
			} else {
			canvas.style.width = "100%";
			canvas.style.height = "100%";
			}

			createUnityInstance(canvas, {
			arguments: [],
			dataUrl: "Build/1.5.64.data.unityweb",
			frameworkUrl: "Build/1.5.64.framework.js.unityweb",
			codeUrl: "Build/1.5.64.wasm.unityweb",
			streamingAssetsUrl: "StreamingAssets",
			companyName: "KaymStudios",
			productName: "KAYMStudios",
			productVersion: "1.5.63",
			// matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
			// devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
			}).then((unityInstance) => {
			}).catch((message) => {
			alert(message);
			});
		</script>
	</body>
</html>

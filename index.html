<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
			<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
				<title>KAYM Studios</title>
				<link rel="icon" type="image/png" href="sherbert.png">
					<link rel="shortcut icon" href="sherbert.ico">
						<style>
							html, body {
							width: 100%;
							height: 100%;
							padding: 0;
							margin: 0;
							overflow: hidden;
							}
							#unity-canvas {
							width: 100%;
							height: 100%;
							background: #231F20;
							display: block;
							}
						</style>
					</head>
	<body style="text-align: center; padding: 0; border: 0; margin: 0;">
		<canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
		<script src="Build/0.3.0.loader.js"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
			// Mobile device style: fill the whole browser client area with the game canvas:
			var meta = document.createElement('meta');
			meta.name = 'viewport';
			meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
			document.getElementsByTagName('head')[0].appendChild(meta);

			canvas.style.width = "100%";
			canvas.style.height = "100%";
			canvas.style.position = "fixed";

			document.body.style.textAlign = "left";
			} else {
			// Desktop style: fill 100% width and height:
			canvas.style.width = "100%";
			canvas.style.height = "100%";
			}

			createUnityInstance(canvas, {
			arguments: [],
			dataUrl: "Build/0.3.0.data.unityweb",
			frameworkUrl: "Build/0.3.0.framework.js.unityweb",
			codeUrl: "Build/0.3.0.wasm.unityweb",
			streamingAssetsUrl: "StreamingAssets",
			companyName: "KaymStudios",
			productName: "KAYMStudios",
			productVersion: "0.3.0",
			// matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
			// devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
			}).then((unityInstance) => {
			}).catch((message) => {
			alert(message);
			});
		</script>
	</body>
</html>
